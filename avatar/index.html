<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox Toolkit — Avatar</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --accent: #6ee7ff;
        --text: #edf6ff;
        --muted: #a8b5c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #15213f 0%, var(--bg) 45%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: min(92vw, 760px);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(110, 231, 255, 0.2);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      }
      .eyebrow {
        margin: 0 0 16px 0;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 12px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Avatar</p>
      <h1>Roblox avatar utilities</h1>
      <p>This page is live at <strong>/avatar</strong> and is ready for your avatar tools, avatar preview sections, and profile widgets.</p>
      <p style="margin-top: 18px;"><a href="/">← Back to home</a></p>
    </main>
  </body>
</html>
